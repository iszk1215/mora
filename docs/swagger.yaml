basePath: /
definitions:
  core.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  core.Repository:
    properties:
      id:
        type: integer
      name:
        type: string
      namespace:
        type: string
      scm_id:
        type: integer
      url:
        type: string
    type: object
  coverage.CodeResponse:
    properties:
      blocks:
        items:
          items:
            type: integer
          type: array
        type: array
      code:
        type: string
      filename:
        type: string
      repo:
        $ref: '#/definitions/core.Repository'
    type: object
  coverage.Coverage:
    properties:
      entries:
        items:
          $ref: '#/definitions/coverage.CoverageEntry'
        type: array
      id:
        format: int64
        type: integer
      repoID:
        format: int64
        type: integer
      revision:
        type: string
      timestamp:
        type: string
    type: object
  coverage.CoverageEntry:
    properties:
      hits:
        type: integer
      lines:
        type: integer
      name:
        type: string
      profiles:
        additionalProperties:
          $ref: '#/definitions/profile.Profile'
        type: object
    type: object
  coverage.CoverageEntryUploadRequest:
    properties:
      entry:
        type: string
      hits:
        type: integer
      lines:
        type: integer
      profiles:
        items:
          $ref: '#/definitions/profile.Profile'
        type: array
    type: object
  coverage.CoverageListResponse:
    properties:
      coverages:
        items:
          $ref: '#/definitions/coverage.CoverageResponse'
        type: array
      repo:
        $ref: '#/definitions/core.Repository'
    type: object
  coverage.CoverageResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/coverage.CoverageEntry'
        type: array
      index:
        type: integer
      revision:
        type: string
      revision_url:
        type: string
      time:
        type: string
    type: object
  coverage.CoverageUploadRequest:
    properties:
      entries:
        items:
          $ref: '#/definitions/coverage.CoverageEntryUploadRequest'
        type: array
      revision:
        type: string
      time:
        type: string
    type: object
  coverage.FileListResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/coverage.FileResponse'
        type: array
      meta:
        $ref: '#/definitions/coverage.MetaResponse'
      repo:
        $ref: '#/definitions/core.Repository'
    type: object
  coverage.FileResponse:
    properties:
      filename:
        type: string
      hits:
        type: integer
      lines:
        type: integer
    type: object
  coverage.MetaResponse:
    properties:
      hits:
        type: integer
      lines:
        type: integer
      revision:
        type: string
      revision_url:
        type: string
      time:
        type: string
    type: object
  profile.Profile:
    properties:
      blocks:
        description: StartLine, EndLine, Count
        items:
          items:
            type: integer
          type: array
        type: array
      filename:
        type: string
      hits:
        type: integer
      lines:
        type: integer
    type: object
  server.ConfigResponse:
    properties:
      site_name:
        type: string
    type: object
  server.CreateAPIKeyRequest:
    properties:
      name:
        type: string
    type: object
  server.CreateAPIKeyResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      key:
        type: string
      key_prefix:
        type: string
      name:
        type: string
    type: object
  server.PasswordLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  server.PendingSignupResponse:
    properties:
      avatar_url:
        type: string
      provider:
        type: string
      username:
        type: string
    type: object
  server.RepositoryManagerResponse:
    properties:
      id:
        type: integer
      logined:
        type: boolean
      name:
        type: string
      url:
        type: string
    type: object
  server.User:
    properties:
      avatar_url:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  server.UserAPIKey:
    properties:
      created_at:
        type: string
      id:
        type: integer
      key_prefix:
        type: string
      name:
        type: string
    type: object
  server.createCoverageTrackerRequest:
    properties:
      name:
        type: string
      repo_id:
        type: integer
      visibility:
        type: string
    type: object
  tracker.CreateSeriesRequest:
    properties:
      config:
        type: string
      data_type:
        type: string
      name:
        type: string
    type: object
  tracker.CreateTrackerRequest:
    properties:
      body:
        type: string
      chart_config:
        type: string
      description:
        type: string
      name:
        type: string
      type:
        description: '"tracker", defaults to "tracker"'
        type: string
      visibility:
        description: 'required: "public"|"private"'
        type: string
    type: object
  tracker.CreateValueRequest:
    properties:
      time:
        type: string
      value:
        type: number
    type: object
  tracker.ListSeriesResponse:
    properties:
      series:
        items:
          $ref: '#/definitions/tracker.SeriesModel'
        type: array
      tracker:
        $ref: '#/definitions/tracker.TrackerResponse'
    type: object
  tracker.ListTrackersResponse:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      trackers:
        items:
          $ref: '#/definitions/tracker.TrackerResponse'
        type: array
    type: object
  tracker.ListValuesResponse:
    properties:
      series:
        $ref: '#/definitions/tracker.SeriesModel'
      values:
        items:
          $ref: '#/definitions/tracker.ValueModel'
        type: array
    type: object
  tracker.PatchSeriesRequest:
    properties:
      config:
        type: string
      data_type:
        type: string
      name:
        type: string
    type: object
  tracker.PatchTrackerRequest:
    properties:
      body:
        type: string
      chart_config:
        type: string
      description:
        type: string
      visibility:
        type: string
    type: object
  tracker.PreviewResponse:
    properties:
      series:
        items:
          $ref: '#/definitions/tracker.PreviewSeriesValues'
        type: array
      tracker:
        $ref: '#/definitions/tracker.TrackerResponse'
    type: object
  tracker.PreviewSeriesValues:
    properties:
      series:
        $ref: '#/definitions/tracker.SeriesModel'
      values:
        items:
          $ref: '#/definitions/tracker.ValueModel'
        type: array
    type: object
  tracker.SeriesModel:
    properties:
      config:
        type: string
      data_type:
        type: string
      id:
        type: integer
      name:
        type: string
      tracker_id:
        type: integer
    type: object
  tracker.TrackerModel:
    properties:
      body:
        type: string
      chart_config:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      last_updated_at:
        type: string
      name:
        type: string
      owner_id:
        type: integer
      type:
        type: string
      visibility:
        type: string
    type: object
  tracker.TrackerResponse:
    properties:
      body:
        type: string
      chart_config:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      last_updated_at:
        type: string
      like_count:
        type: integer
      liked:
        type: boolean
      name:
        type: string
      owner_id:
        type: integer
      owner_name:
        type: string
      role:
        description: '"" | "owner" | "editor"'
        type: string
      type:
        type: string
      visibility:
        description: '"public" | "private"'
        type: string
    type: object
  tracker.ValueModel:
    properties:
      id:
        type: integer
      seriesId:
        type: integer
      time:
        type: string
      value:
        type: number
    type: object
  udm.ItemModel:
    properties:
      id:
        type: integer
      metric_id:
        type: integer
      name:
        type: string
      type:
        $ref: '#/definitions/udm.ValueType'
    type: object
  udm.ListItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/udm.ItemModel'
        type: array
      metric:
        $ref: '#/definitions/udm.MetricModel'
      repo:
        $ref: '#/definitions/core.Repository'
    type: object
  udm.ListMetricsResponse:
    properties:
      metrics:
        items:
          $ref: '#/definitions/udm.MetricModel'
        type: array
      repo:
        $ref: '#/definitions/core.Repository'
    type: object
  udm.ListValuesResponse:
    properties:
      items:
        $ref: '#/definitions/udm.ItemModel'
      repo:
        $ref: '#/definitions/core.Repository'
      values:
        items:
          $ref: '#/definitions/udm.ValueModel'
        type: array
    type: object
  udm.MetricModel:
    properties:
      id:
        type: integer
      name:
        type: string
      repo_id:
        type: integer
    type: object
  udm.ValueModel:
    properties:
      id:
        type: integer
      itemId:
        type: integer
      time:
        type: string
      value:
        type: string
    type: object
  udm.ValueType:
    enum:
    - 1
    type: integer
    x-enum-varnames:
    - ValueTypeInt
info:
  contact: {}
  description: Mora is a code coverage tracker API.
  title: Mora API
  version: "1.0"
paths:
  /api/auth/csrf:
    get:
      description: Generate and return a CSRF token via cookie and JSON body
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get CSRF token
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with a username and password, creating a session
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.PasswordLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Log in with username and password
      tags:
      - auth
  /api/config:
    get:
      description: Return server configuration (e.g. site name)
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ConfigResponse'
      summary: Get server config
      tags:
      - server
  /api/coverages:
    post:
      consumes:
      - application/json
      description: Create a coverage-type tracker linked to a repository. The repository
        must not already have a coverage tracker.
      parameters:
      - description: Coverage tracker information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.createCoverageTrackerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tracker.TrackerModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Create a coverage tracker
      tags:
      - coverage
  /api/coverages/{trackerId}:
    get:
      description: Return coverage history for a tracker (public list endpoint)
      parameters:
      - description: Tracker ID
        in: path
        name: trackerId
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/coverage.CoverageListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: List coverages for a tracker
      tags:
      - coverage
    post:
      consumes:
      - application/json
      description: Upload coverage entries for a repository linked to a tracker
      parameters:
      - description: Tracker ID
        in: path
        name: trackerId
        required: true
        type: integer
      - description: Coverage data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/coverage.CoverageUploadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/coverage.Coverage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Upload coverage data
      tags:
      - coverage
  /api/coverages/{trackerId}/{id}/{entry}/files:
    get:
      description: Return the file list and metadata for a coverage entry
      parameters:
      - description: Tracker ID
        in: path
        name: trackerId
        required: true
        type: integer
      - description: Coverage index
        in: path
        name: id
        required: true
        type: integer
      - description: Entry name
        in: path
        name: entry
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/coverage.FileListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: List files in a coverage entry
      tags:
      - coverage
  /api/coverages/{trackerId}/{id}/{entry}/files/{filepath}:
    get:
      description: Return the source code and coverage blocks for a file in an entry
      parameters:
      - description: Tracker ID
        in: path
        name: trackerId
        required: true
        type: integer
      - description: Coverage index
        in: path
        name: id
        required: true
        type: integer
      - description: Entry name
        in: path
        name: entry
        required: true
        type: string
      - description: File path
        in: path
        name: filepath
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/coverage.CodeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Get a source file
      tags:
      - coverage
  /api/coverages/{trackerId}/preview:
    get:
      description: Return coverage timeline data as virtual series for a tracker
      parameters:
      - description: Tracker ID
        in: path
        name: trackerId
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tracker.PreviewResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Preview coverage data
      tags:
      - coverage
  /api/me:
    get:
      description: Return the current session user, or 204 if not logged in
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.User'
        "204":
          description: No Content
      summary: Get current user
      tags:
      - server
  /api/providers:
    get:
      description: Return configured SCM repository managers and their login status
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.RepositoryManagerResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: List SCM providers
      tags:
      - server
  /api/repos:
    get:
      description: List repositories the current session can access
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/core.Repository'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: List repositories
      tags:
      - server
  /api/repos/{repo_id}/udm/metrics:
    get:
      description: Return all UDM metrics for the repository
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/udm.ListMetricsResponse'
      summary: List metrics
      tags:
      - udm
    post:
      consumes:
      - application/json
      description: Create a new UDM metric for the repository
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/udm.MetricModel'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/udm.MetricModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Create a metric
      tags:
      - udm
  /api/repos/{repo_id}/udm/metrics/{metricId}:
    delete:
      description: Delete a UDM metric and its items
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Delete a metric
      tags:
      - udm
  /api/repos/{repo_id}/udm/metrics/{metricId}/items:
    get:
      description: Return all UDM items for a metric
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/udm.ListItemsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: List items
      tags:
      - udm
    post:
      consumes:
      - application/json
      description: Create a new UDM item for a metric
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      - description: Item information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/udm.ItemModel'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/udm.ItemModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Create an item
      tags:
      - udm
  /api/repos/{repo_id}/udm/metrics/{metricId}/items/{itemId}:
    delete:
      description: Delete a UDM item and its values
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      - description: Item ID
        in: path
        name: itemId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Delete an item
      tags:
      - udm
  /api/repos/{repo_id}/udm/metrics/{metricId}/items/{itemId}/values:
    delete:
      description: Delete all values for a UDM item
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      - description: Item ID
        in: path
        name: itemId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Delete all values
      tags:
      - udm
    get:
      description: Return all values for a UDM item
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      - description: Item ID
        in: path
        name: itemId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/udm.ListValuesResponse'
      summary: List values
      tags:
      - udm
    post:
      consumes:
      - application/json
      description: Add a value to a UDM item
      parameters:
      - description: Repository ID
        in: path
        name: repo_id
        required: true
        type: integer
      - description: Metric ID
        in: path
        name: metricId
        required: true
        type: integer
      - description: Item ID
        in: path
        name: itemId
        required: true
        type: integer
      - description: Value information
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/udm.ValueModel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/udm.ValueModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Add a value
      tags:
      - udm
  /api/signup/cancel:
    post:
      description: Cancel the pending signup for the current session
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Cancel pending signup
      tags:
      - auth
  /api/signup/confirm:
    post:
      description: Create a user from the pending signup and log in
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.User'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/core.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/core.ErrorResponse'
      summary: Confirm pending signup
      tags:
      - auth
  /api/signup/pending:
    get:
      description: Return the pending signup information for the current session
